#:schema node_modules/wrangler/config-schema.json
name = "smart-document-reader"
compatibility_date = "2024-04-05"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "document-reader-db"
database_id = "0f451b17-9956-4b12-9724-0371ddd0f675"

# R2 Bucket binding
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "smart-document-reader-storage"
preview_bucket_name = "smart-document-reader-storage-preview"

[vars]
# OpenRouter API Key (this should ideally be a secret, but defined here for development reference)
# R2 Keys are needed if we generate presigned URLs using aws-sdk rather than direct R2 binding, 
# but we can try to use standard Cloudflare R2 bindings inside Pages.
