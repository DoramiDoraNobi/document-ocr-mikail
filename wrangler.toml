#:schema node_modules/wrangler/config-schema.json
name = "smart-document-reader"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".open-next/cloudflare"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "document-reader-db"
database_id = "0f451b17-9956-4b12-9724-0371ddd0f675"

# R2 Bucket binding
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "smart-document-reader-storage"
preview_bucket_name = "smart-document-reader-storage-preview"
